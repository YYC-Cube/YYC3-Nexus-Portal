name: Bug Report
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索是否已有相同 Issue。
        安全问题请勿在此提交，请按 [SECURITY.md](https://github.com/YYC-Cube/YYC3-Nexus-Portal/blob/main/SECURITY.md) 私下报告。

  - type: dropdown
    id: deployment
    attributes:
      label: 部署形态
      description: 问题出现在哪种运行方式下？
      options:
        - GitHub Pages（portal.yyc3.top）
        - Docker / Standalone
        - 本地开发（pnpm dev）
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 浏览器与版本、操作系统、Node/pnpm 版本
      placeholder: "Chrome 130 / macOS 15 / Node 22.22.3 / pnpm 10.34.7"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最小可复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 如有报错，请附控制台或终端输出
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、录屏、相关 Issue 链接
    validations:
      required: false
