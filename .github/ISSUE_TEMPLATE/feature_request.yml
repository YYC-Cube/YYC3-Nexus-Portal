name: Feature Request
description: 提出功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请描述你希望解决的问题，而不只是实现方式。

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - i18n 国际化
        - UI / 3D 视觉
        - AI 助手
        - 构建与部署
        - 文档
        - 其它
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前存在什么不便或缺口？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为或实现思路
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其它做法及取舍
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该功能需同时兼容 Standalone 与 GitHub Pages 静态导出
          required: false
        - label: 涉及用户可见文案时需同步 10 种语言（214 键）
          required: false
